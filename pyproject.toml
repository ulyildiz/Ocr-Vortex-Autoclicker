[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-autoclicker"
dynamic = ["version"]
description = "OCR-based auto-clicker for Vortex + Nexus Mods free downloads - no screenshots or image templates needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name" }]
keywords = ["vortex", "nexus-mods", "auto-clicker", "ocr", "automation", "modding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "rapidocr>=2.0",
    "onnxruntime>=1.16",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
vortex-autoclicker = "vortex_autoclicker.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/vortex-autoclicker"
Issues = "https://github.com/your-username/vortex-autoclicker/issues"
Changelog = "https://github.com/your-username/vortex-autoclicker/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "vortex_autoclicker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vortex_autoclicker = ["py.typed"]

# --------------------------------------------------------------- tooling ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["vortex_autoclicker"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyautogui", "keyboard", "cv2", "rapidocr", "rapidocr_onnxruntime"]
ignore_missing_imports = true
